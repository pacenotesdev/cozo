[workspace]
resolver = "2"
members = [
    "cozo-core",
    "cozo-bin",
    "cozo-lib-c",
    "cozo-lib-java",
    "cozo-lib-wasm",
    "cozo-lib-swift",
    "cozo-lib-python",
    "cozo-lib-nodejs",
    "cozo-core-examples",
]
# The legacy RocksDB bridge is kept in the tree but not built. See `storage-rocksdb` in
# cozo-core/Cargo.toml.
exclude = ["cozorocks"]

[profile.bench]
lto = true
debug = true
